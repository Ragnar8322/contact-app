name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Tamaño de la carga inicial
        run: npm run check:bundle

  database:
    name: Base de datos (migraciones, pgTAP y tipos)
    runs-on: ubuntu-latest
    env:
      # Las imágenes de Supabase se bajan de GitHub Container Registry: el registro
      # por defecto (public.ecr.aws) limita las descargas anónimas y cortaba el CI.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # Solo Postgres: aplica supabase/migrations y supabase/seed.sql desde cero.
      # Si una migración no reconstruye la base, este paso falla.
      - name: Construir la base desde las migraciones
        run: >
          supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Pruebas de permisos y funciones (pgTAP)
        run: supabase test db

      - name: Tipos de TypeScript al día con el esquema
        run: |
          supabase gen types typescript --local > /tmp/types.ts
          node scripts/check-db-types.mjs /tmp/types.ts

  e2e:
    name: Punta a punta (Playwright)
    runs-on: ubuntu-latest
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Levantar Supabase local (base, auth y API)
        run: |
          supabase start -x studio,imgproxy,logflare,vector,edge-runtime,storage-api,realtime,supavisor,mailpit,postgres-meta
          eval "$(supabase status -o env)"
          echo "E2E_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Flujos de agente, supervisor y admin
        run: npx playwright test

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
